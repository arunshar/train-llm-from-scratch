project_name: train-llm-from-scratch
project_owner: Arun Sharma
decision_owner: Arun Sharma
incident_contact: MSI user arunshar
project_class: single-gpu-smoke
scientific_or_engineering_goal: Verify that the reduced 13M pipeline completes both the upstream and sequential topologies on one MSI H100.

repository_source: https://github.com/arunshar/train-llm-from-scratch
local_repository_root: /Users/arunsharma/code/train-llm-from-scratch
remote_repository_root: /users/1/arunshar/train-llm-from-scratch
expected_branch: main
expected_commit: resolved from clean HEAD by the submission scripts and recorded in each run envelope
remote_worktree_policy: clean-required
allowed_source_edits: local-only
allowed_commit_behavior: arun-only
allowed_push_behavior: arun-only

environment_strategy: apptainer-prebuilt
environment_lock_file: hpc/requirements.lock
python_or_runtime_version: VERIFY_FROM_CONTAINER_DURING_BOOTSTRAP
module_requirements: []
container_strategy: prebuilt-sif
container_image_or_definition: docker://pytorch/pytorch:2.14.0-cuda12.6-cudnn9-runtime
container_digest: FROM_DISCOVERY_AFTER_BOOTSTRAP
cuda_version: "12.6"
framework_version: torch==2.14.0

entry_point: hpc/run_smoke.sh
smoke_entry_point: bash hpc/submit_smoke.sh
full_run_entry_point: NOT_APPLICABLE_YET
evaluation_entry_point: hpc/verify_smoke.py
checkpoint_resume_entry_point: NOT_APPLICABLE

fixture_or_smoke_data: generated by hpc/make_smoke_fixtures.py inside a fresh run directory
training_data_location: NOT_APPLICABLE
data_owner: Arun Sharma
data_license: synthetic-no-restriction
data_classification: public
data_manifest: fixture_manifest.json
data_manifest_checksum: generated with the fixture
allowed_data_transfer: none

MSI_project: shekhars
Slurm_account: shekhars
partition: msigpu
QOS: partition-default-common_agate
GPU_type: h100
GPU_count: 1
CPU_count: 8
memory: 64G
wall_time: "00:30:00"
maximum_concurrent_jobs: 1
maximum_total_jobs: 2
maximum_retry_count: 1
maximum_storage_written: 20G

artifact_parent: /scratch.global/arunshar/train-llm-from-scratch/runs
run_directory: minted by hpc/submit_smoke.sh
stdout_path: RUN_DIRECTORY/slurm-JOB_ID.out
stderr_path: RUN_DIRECTORY/slurm-JOB_ID.err
result_artifact: RUN_DIRECTORY/smoke_result.json
checkpoint_path: RUN_DIRECTORY/ckpts
environment_artifact: RUN_DIRECTORY/environment.txt
provenance_manifest: RUN_DIRECTORY/source_commit.txt

success_criteria: RESULT_STATUS equals SMOKE_RESULT_VERIFIED and all eight expected checkpoints load and produce finite logits.
failure_categories:
  - source_identity
  - environment
  - scheduler
  - fixture
  - training
  - checkpoint
  - verification
monitoring_interval: 60
authorization_expiration: after the bootstrap and one smoke attempt plus one bounded retry
teardown_policy: cancel only exact job IDs created by this project
retention_policy: retain smoke logs, provenance, and checkpoints for 30 days
promotion_authority: Arun Sharma
external_actions_explicitly_excluded:
  - repository pushes
  - model publication
  - production claims
  - real dataset transfer
  - default 400M training
