project_class: single-gpu-400m-pretrain-stage1
scientific_or_engineering_goal: >-
  Stage 1 of the 400M envelope. Prepare one bounded Pile subset (val plus train
  shard 00) and train the default 400M base on one H100 for up to 24 hours with
  checkpoint resume. This is not a finished 50k-step pretrain and it is not SFT,
  DPO, PPO, or GRPO.

